name: Atlas Discovery
description: >-
  Atlas Discovery is an AI-powered biotechnology company (Y Combinator Summer
  2026) building foundation models of human patient biology to predict how people
  will respond to drugs in clinical trials. Nine of ten drugs fail in trials
  because no animal model or cell in a dish reliably predicts a human response;
  Atlas Discovery trains models on preclinical and clinical data to improve trial
  design and rescue stalled drug programs. Its research spans single-cell
  representation learning (ExpressionVAE) and clinical response prediction, with
  work presented at ICLR '26, ICML '26, and CSHL '26. The company is an
  early-stage research lab with no public API, developer program, or product
  surface yet; this profile is maintained in the API Evangelist network as a
  portfolio lead awaiting a public developer offering.
